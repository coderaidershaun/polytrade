# rex:pre-commit
# Installed by `rex init`. Needs pre-commit, gitleaks and trivy on PATH.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      # Files with recorded data stay byte for byte as recorded: fixtures, link frames,
      # proptest regression seeds, notebooks, and lock files.
      - id: end-of-file-fixer
        exclude: '(^|/)fixtures/|(^|/)link_frames\.txt$|(^|/)proptest-regressions/|\.ipynb$|\.lock$'
      - id: trailing-whitespace
        exclude: '(^|/)fixtures/|(^|/)link_frames\.txt$|(^|/)proptest-regressions/|\.ipynb$|\.lock$'

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
      - id: trivy
        name: trivy secrets, vulnerabilities and misconfigurations
        entry: trivy fs --timeout 15m --quiet --skip-version-check --scanners secret,vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs target,node_modules,.claude,.rex --skip-files .env .
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: posttrade-lock
        name: posttrade uv lock matches pyproject
        entry: uv sync --locked --project posttrade
        language: system
        files: ^posttrade/
        pass_filenames: false
      - id: posttrade-ruff-format
        name: posttrade ruff format
        entry: uv run --project posttrade ruff format --check posttrade
        language: system
        files: ^posttrade/
        pass_filenames: false
      - id: posttrade-ruff
        name: posttrade ruff check
        entry: uv run --project posttrade ruff check posttrade
        language: system
        files: ^posttrade/
        pass_filenames: false
      - id: posttrade-mypy
        name: posttrade mypy
        entry: bash -c 'cd posttrade && uv run mypy .'
        language: system
        files: ^posttrade/
        pass_filenames: false
      - id: posttrade-pytest
        name: posttrade pytest against a fresh golden run
        entry: bash -c 'cargo run -q -p engine --bin golden-run -- target/golden-run && cd posttrade && uv run pytest -q'
        language: system
        files: ^(posttrade/|contract/|tools/golden-run/)
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
